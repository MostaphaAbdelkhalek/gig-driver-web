  <title>Gig Driver — Powered by GigDecider AI</title>
  <meta name="theme-color" content="#020817">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #020817;
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
    }
    #canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    #status-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 42%, #0A1D3A 0%, #020817 64%);
      z-index: 10;
      transition: opacity 0.35s ease;
    }
    #status-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .crest {
      width: 112px;
      height: 112px;
      margin-bottom: 18px;
      filter: drop-shadow(0 0 24px rgba(51, 153, 255, 0.35));
      user-select: none;
      -webkit-user-drag: none;
    }
    .wordmark {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 0.14em;
      color: #FFFFFF;
      text-transform: uppercase;
      margin: 0 0 6px 0;
    }
    .wordmark span {
      color: #3399FF;
    }
    .sub {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.22em;
      color: #94A3B8;
      text-transform: uppercase;
      margin-bottom: 24px;
    }
    .progress-track {
      width: min(280px, 72vw);
      height: 6px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.16);
      overflow: hidden;
      border: 1px solid rgba(51, 153, 255, 0.28);
    }
    .progress-fill {
      height: 100%;
      width: 10%;
      background: linear-gradient(90deg, #3399FF 0%, #B0FF33 100%);
      border-radius: 999px;
      transition: width 0.16s ease-out;
    }
    .progress-label {
      margin-top: 10px;
      font-size: 11px;
      letter-spacing: 0.12em;
      color: #B0FF33;
      text-transform: uppercase;
    }
    #error-notice {
      display: none;
      margin-top: 14px;
      max-width: 360px;
      text-align: center;
      color: #FB7185;
      font-size: 13px;
      line-height: 1.45;
    }
    #play-sound-btn {
      display: none;
      margin-top: 18px;
      padding: 14px 28px;
      border: 0;
      border-radius: 999px;
      background: #B0FF33;
      color: #020817;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 8px 28px rgba(176, 255, 51, 0.35);
      transition: transform 0.12s ease, background-color 0.12s ease;
    }
    #play-sound-btn:hover {
      background: #C4FF66;
      transform: translateY(-1px);
    }
    #sound-hint {
      display: none;
      margin-top: 10px;
      font-size: 12px;
      color: #94A3B8;
    }
  </style>

    <h1 class="wordmark">GIG <span>DRIVER</span></h1>
    <div class="sub">POWERED BY GIGDECIDER AI</div>
    <div class="progress-track">
      <div id="progress-fill" class="progress-fill"></div>
    </div>
    <div id="progress-label" class="progress-label">LOADING CITY...</div>
    <button id="play-sound-btn" type="button">&#9654;&nbsp;&nbsp;PLAY WITH SOUND</button>
    <div id="sound-hint">Tap to enable engine, voice &amp; city radio</div>
    <div id="error-notice"></div>
  </div>
  <script src="index.js"></script>
  <script>
    (function () {
      const overlay = document.getElementById('status-overlay');
      const canvasEl = document.getElementById('canvas');
      const track = document.querySelector('.progress-track');
      const fill = document.getElementById('progress-fill');
      const label = document.getElementById('progress-label');
      const playBtn = document.getElementById('play-sound-btn');
      const soundHint = document.getElementById('sound-hint');
      const errBox = document.getElementById('error-notice');
      const engine = new Engine({"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":9862900,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4});

      function showError(msg) {
        label.style.display = 'none';
        if (playBtn) playBtn.style.display = 'none';
        if (soundHint) soundHint.style.display = 'none';
        errBox.style.display = 'block';
        errBox.textContent = msg || 'Unable to launch WebGL2 engine in this browser.';
      }

      function dismissOverlay() {
        if (window.__gdUnlockAudio) window.__gdUnlockAudio();
        if (canvasEl && typeof canvasEl.focus === 'function') {
          try { canvasEl.focus(); } catch (_) {}
        }
        if (overlay) {
          overlay.classList.add('hidden');
          setTimeout(function () {
            if (overlay && overlay.parentNode) overlay.parentNode.removeChild(overlay);
          }, 400);
        }
      }

      if (playBtn) {
        playBtn.addEventListener('click', dismissOverlay);
        window.addEventListener('keydown', function onKey(e) {
          if (playBtn.style.display === 'inline-block' && (e.key === 'Enter' || e.key === ' ')) {
            window.removeEventListener('keydown', onKey);
            dismissOverlay();
          }
        });
      }

      engine.startGame({
        onProgress: function (current, total) {
          if (total > 0) {
            const pct = Math.max(8, Math.min(100, Math.round((current / total) * 100)));
            fill.style.width = pct + '%';
            label.textContent = pct >= 100 ? 'STARTING ENGINE...' : ('LOADING ' + pct + '%');
          }
        },
      }).then(function () {
        if (window.__gdUnlockAudio) window.__gdUnlockAudio();
        var contexts = window.__gdAudioContexts || [];
        var anyRunning = contexts.some(function (c) { return c && c.state === 'running'; });
        if (contexts.length > 0 && anyRunning) {
          dismissOverlay();
          return;
        }
        if (track) track.style.display = 'none';
        label.style.display = 'none';
        if (playBtn) playBtn.style.display = 'inline-block';
        if (soundHint) soundHint.style.display = 'block';
      }, function (err) {
        showError(err && err.message ? err.message : String(err));
      });
    })();
  </script>
